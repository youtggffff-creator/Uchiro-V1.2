<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uchiro Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070c;
    --bg-2:#0b0d16;
    --card:#12141f;
    --card-hi:#181b2b;
    --line:rgba(255,255,255,.07);
    --gold-1:#ffe9a8;
    --gold-2:#e8c766;
    --gold-3:#a8842f;
    --blue:#4fd1ff;
    --blue-dim:#2a6f8c;
    --cloud:#f2f3f7;
    --muted:#868c9e;
    --warranty:#35d68a;
    --danger:#ff5c6c;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--cloud);
    font-family:'Poppins','Noto Sans Khmer',sans-serif; overflow-x:hidden;}
  body{ padding-bottom:28px; }
  ::selection{ background:var(--gold-2); color:#06070c; }

  /* ---------- ambient background: cloud drift + lightning pulse (signature motion) ---------- */
  .fx{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .glow{
    position:absolute; width:130vw; height:130vw; left:50%; top:-70vw;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(79,209,255,.16) 0%, rgba(79,209,255,0) 60%);
    animation:pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55; transform:translateX(-50%) scale(1);} 50%{opacity:1; transform:translateX(-50%) scale(1.08);} }
  .cloud{ position:absolute; opacity:.10; filter:blur(1px); animation:drift linear infinite; }
  @keyframes drift{ from{ transform:translateX(-10vw) translateY(0);} to{ transform:translateX(110vw) translateY(-6vh);} }
  .bolt{ position:absolute; width:2px; background:linear-gradient(var(--blue), transparent); opacity:0;
    animation:flicker 5.5s ease-in infinite; }
  @keyframes flicker{ 0%,92%{opacity:0;} 93%{opacity:.9;} 94%{opacity:0;} 96%{opacity:.6;} 97%{opacity:0;} }

  .wrap{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 14px; }

  /* ---------- top utility bar (music / channel / language) ---------- */
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding-top:14px; }
  .icon-btn{ width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); transition:.15s; }
  .icon-btn:active{ transform:scale(.92); }
  .icon-btn.active{ color:var(--gold-1); border-color:var(--gold-2); background:rgba(232,199,102,.1); }
  .topbar-right{ display:flex; gap:8px; }

  /* ---------- header ---------- */
  header{ padding:10px 0 8px; text-align:center; }
  .logo-ring{ width:74px; height:74px; margin:0 auto 8px; border-radius:50%; padding:3px;
    background:conic-gradient(from 0deg, var(--blue), var(--gold-2), var(--blue)); animation:spin-slow 6s linear infinite; }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }
  .logo-ring-inner{ width:100%; height:100%; border-radius:50%; background:var(--bg); display:flex;
    align-items:center; justify-content:center; overflow:hidden; }
  .logo-ring-inner img{ width:100%; height:100%; object-fit:cover; }
  .logo-ring-inner .fallback{ font-size:26px; }
  .logo-word{
    font-family:'Anton',sans-serif; letter-spacing:2px; font-size:28px; line-height:1;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 26px rgba(232,199,102,.35);
  }
  .logo-sub{ font-size:11px; letter-spacing:5px; color:var(--blue); margin-top:2px; font-weight:600; }
  .badgerow{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .trust{
    display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
    border:1px solid rgba(53,214,138,.35); background:rgba(53,214,138,.08); border-radius:999px;
    font-size:12px; color:var(--warranty); font-weight:600;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--warranty); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .channel-btn{ display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
    border:1px solid rgba(79,209,255,.35); background:rgba(79,209,255,.08); color:var(--blue);
    font-size:12px; font-weight:600; text-decoration:none; }

  /* ---------- search + filter ---------- */
  .searchbar{ display:flex; gap:8px; margin-top:16px; }
  .search{ flex:1; display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; padding:11px 14px; }
  .search input{ background:none; border:none; outline:none; color:var(--cloud); font-size:14px; width:100%;
    font-family:inherit; }
  .search input::placeholder{ color:var(--muted); }
  .search svg{ flex-shrink:0; opacity:.6; }

  .chiprow-wrap{ position:relative; margin-top:12px; }
  .chiprow-wrap::after{ content:''; position:absolute; right:0; top:0; bottom:2px; width:28px;
    background:linear-gradient(90deg, transparent, var(--bg) 85%); pointer-events:none; }
  .chiprow{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; scroll-snap-type:x proximity; }
  .chiprow::-webkit-scrollbar{ display:none; }
  .chip{ flex-shrink:0; padding:9px 16px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; transition:.15s; white-space:nowrap; scroll-snap-align:start; }
  .chip.active{ background:linear-gradient(135deg, rgba(79,209,255,.18), rgba(232,199,102,.14));
    border-color:var(--blue); color:var(--cloud); box-shadow:0 0 16px rgba(79,209,255,.18); }
  .chip:active{ transform:scale(.96); }

  .pricerow{ display:flex; gap:8px; overflow-x:auto; margin-top:8px; scrollbar-width:none; }
  .pricerow::-webkit-scrollbar{ display:none; }
  .pill{ flex-shrink:0; padding:7px 13px; border-radius:999px; background:transparent; border:1px solid var(--line);
    color:var(--muted); font-size:12px; cursor:pointer; }
  .pill.active{ border-color:var(--gold-2); color:var(--gold-1); background:rgba(232,199,102,.08); }

  /* ---------- grid ---------- */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    position:relative; opacity:0; transform:translateY(10px); animation:rise .45s ease forwards; cursor:pointer;
    transition:transform .18s, border-color .18s; }
  .card:active{ transform:scale(.97); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .card .thumb{ width:100%; aspect-ratio:1/1; background:linear-gradient(160deg,#181b2b,#0d0f18); position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .card .thumb img{ width:100%; height:100%; object-fit:cover; }
  .card .thumb .ph{ font-size:34px; opacity:.35; }
  .badge-war{ position:absolute; top:8px; left:8px; background:rgba(53,214,138,.16); border:1px solid rgba(53,214,138,.5);
    color:var(--warranty); font-size:10px; font-weight:700; padding:4px 8px; border-radius:8px; backdrop-filter:blur(4px); z-index:2; }
  .badge-trade{ position:absolute; top:8px; left:8px; background:rgba(232,199,102,.16); border:1px solid rgba(232,199,102,.5);
    color:var(--gold-1); font-size:10px; font-weight:700; padding:4px 8px; border-radius:8px; backdrop-filter:blur(4px); z-index:2; }
  .badge-stock{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); color:var(--muted); font-size:10px;
    font-weight:600; padding:4px 7px; border-radius:8px; backdrop-filter:blur(4px); z-index:2; }
  .card .info{ padding:10px 11px 12px; }
  .card .name{ font-size:12.5px; font-weight:600; color:var(--cloud); line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:32px; }
  .card .price{ margin-top:6px; font-family:'Anton',sans-serif; font-size:17px; letter-spacing:.5px;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .card .buybtn{ margin-top:8px; width:100%; border:none; border-radius:10px; padding:8px 0; font-size:12px;
    font-weight:700; letter-spacing:.3px; color:#06070c;
    background:linear-gradient(135deg, var(--blue), #8be9ff); box-shadow:0 4px 14px rgba(79,209,255,.28); }

  .empty{ grid-column:1/-1; text-align:center; padding:52px 12px; color:var(--muted); font-size:13px; }
  .empty .em{ font-size:34px; margin-bottom:10px; }

  .loading{ grid-column:1/-1; text-align:center; padding:40px 0; color:var(--muted); font-size:13px; }
  .spin{ width:26px; height:26px; border:3px solid rgba(79,209,255,.2); border-top-color:var(--blue);
    border-radius:50%; margin:0 auto 10px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- detail sheet ---------- */
  .sheet-bg{ position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); z-index:10;
    opacity:0; pointer-events:none; transition:opacity .2s; }
  .sheet-bg.show{ opacity:1; pointer-events:all; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--bg-2);
    border-top:1px solid var(--line); border-radius:22px 22px 0 0; max-width:520px; margin:0 auto;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.3,1); max-height:82vh; overflow-y:auto; }
  .sheet.show{ transform:translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--line); border-radius:99px; margin:10px auto 4px; }
  .sheet .thumb-big{ width:100%; aspect-ratio:4/3; background:linear-gradient(160deg,#181b2b,#0d0f18);
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .sheet .thumb-big img{ width:100%; height:100%; object-fit:cover; }
  .sheet-body{ padding:16px 18px 22px; }
  .sheet-name{ font-size:18px; font-weight:700; }
  .sheet-badges{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .b{ font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; }
  .b.war{ background:rgba(53,214,138,.14); color:var(--warranty); border:1px solid rgba(53,214,138,.4); }
  .b.stock{ background:rgba(79,209,255,.1); color:var(--blue); border:1px solid rgba(79,209,255,.3); }
  .sheet-desc{ margin-top:12px; font-size:13px; line-height:1.6; color:var(--muted); white-space:pre-wrap; }
  .sheet-price{ margin-top:16px; font-family:'Anton',sans-serif; font-size:28px; letter-spacing:.5px;
    background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .sheet-buy{ margin-top:16px; width:100%; border:none; border-radius:14px; padding:15px 0; font-size:15px;
    font-weight:700; color:#06070c; background:linear-gradient(135deg, var(--blue), #8be9ff);
    box-shadow:0 8px 24px rgba(79,209,255,.3); }
</style>
</head>
<body data-bot="{{ bot_username }}">

  <div class="fx">
    <div class="glow"></div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <div class="icon-btn" id="musicBtn" title="Music">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="topbar-right">
        <div class="icon-btn" id="langBtn" title="Language">🌐</div>
        <a class="icon-btn" href="https://t.me/{{ channel_username }}" target="_blank" title="Channel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 2.7 2.6 10.3c-1.3.5-1.3 1.2-.2 1.6l4.9 1.5 1.9 5.8c.2.6.4.8.9.8s.7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8L23.9 4c.4-1.3-.4-1.9-1.9-1.3Z"/></svg>
        </a>
      </div>
    </div>
    <audio id="bgMusic" loop preload="none">
      {% if music_url %}<source src="{{ music_url }}">{% endif %}
    </audio>

    <header>
      <div class="logo-ring">
        <div class="logo-ring-inner">
          {% if logo_url %}<img src="{{ logo_url }}">{% else %}<div class="fallback">🏴‍☠️</div>{% endif %}
        </div>
      </div>
      <div class="logo-word">UCHIRO STORE</div>
      <div class="logo-sub">🇰🇭 BLOX FRUITS · MULTI-GAME</div>
      <div class="badgerow">
        <div class="trust"><span class="live-dot"></span> ការទិញត្រូវបានធានា 100%</div>
        <a class="channel-btn" href="https://t.me/{{ channel_username }}" target="_blank">📢 Channel</a>
      </div>
    </header>

    <div class="searchbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#868c9e" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="ស្វែងរក..." />
      </div>
    </div>

    <div class="chiprow-wrap"><div class="chiprow" id="catRow"></div></div>
    <div class="pricerow" id="priceRow">
      <div class="pill active" data-min="0" data-max="999999">ថ្មីៗ</div>
      <div class="pill" data-min="0" data-max="10">ក្រោម 10$</div>
      <div class="pill" data-min="10" data-max="20">$10–20</div>
      <div class="pill" data-min="30" data-max="999999">$30+</div>
    </div>

    <div class="grid" id="grid">
      <div class="loading"><div class="spin"></div>កំពុងផ្ទុក...</div>
    </div>
  </div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="thumb-big" id="sheetThumb"><div class="ph">🍈</div></div>
    <div class="sheet-body">
      <div class="sheet-name" id="sheetName"></div>
      <div class="sheet-badges" id="sheetBadges"></div>
      <div class="sheet-desc" id="sheetDesc"></div>
      <div class="sheet-price" id="sheetPrice"></div>
      <button class="sheet-buy" id="sheetBuy">🛍 ទិញឥឡូវ</button>
    </div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#06070c'); tg.setBackgroundColor?.('#06070c'); }

let ALL_ITEMS = [];
let CATEGORIES = [];
let state = { category: 'All', search: '', min: 0, max: 999999 };

function haptic(){ tg?.HapticFeedback?.impactOccurred('light'); }

// drifting cloud + lightning ambience
function buildFX(){
  const fx = document.querySelector('.fx');
  for(let i=0;i<4;i++){
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = (10 + i*20) + 'vh';
    c.style.width = (140 + i*30) + 'px';
    c.style.height = (60 + i*10) + 'px';
    c.style.background = 'radial-gradient(ellipse, #f2f3f7 0%, transparent 70%)';
    c.style.animationDuration = (22 + i*7) + 's';
    c.style.animationDelay = (i*3) + 's';
    fx.appendChild(c);
  }
  for(let i=0;i<3;i++){
    const b = document.createElement('div');
    b.className = 'bolt';
    b.style.left = (15 + i*30) + 'vw';
    b.style.top = '0';
    b.style.height = (30 + i*8) + 'vh';
    b.style.animationDelay = (i*1.8) + 's';
    fx.appendChild(b);
  }
}

async function loadItems(){
  try{
    const res = await fetch('/api/items');
    const data = await res.json();
    ALL_ITEMS = data.items;
    CATEGORIES = ['All', ...data.categories];
    buildCatRow();
    render();
  }catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty"><div class="em">⚠️</div>មិនអាចផ្ទុកទិន្នន័យបានទេ<br>សូម Refresh ម្តងទៀត</div>';
  }
}

function buildCatRow(){
  const row = document.getElementById('catRow');
  row.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const el = document.createElement('div');
    el.className = 'chip' + (cat===state.category?' active':'');
    el.textContent = cat === 'All' ? (LANG_TEXT[curLang]?.all || 'ទាំងអស់') : cat;
    el.onclick = ()=>{ haptic(); state.category = cat; buildCatRow(); render(); };
    row.appendChild(el);
  });
}

document.getElementById('searchInput').addEventListener('input', e=>{
  state.search = e.target.value.trim().toLowerCase();
  render();
});

document.querySelectorAll('#priceRow .pill').forEach(p=>{
  p.onclick = ()=>{
    haptic();
    document.querySelectorAll('#priceRow .pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    state.min = parseFloat(p.dataset.min);
    state.max = parseFloat(p.dataset.max);
    render();
  };
});

function render(){
  const grid = document.getElementById('grid');
  let items = ALL_ITEMS.filter(it=>{
    if (state.category !== 'All' && it.category !== state.category) return false;
    if (state.search && !it.name.toLowerCase().includes(state.search)) return false;
    if (it.price < state.min || it.price > state.max) return false;
    return true;
  });

  if (items.length === 0){
    grid.innerHTML = '<div class="empty"><div class="em">🔍</div>រកមិនឃើញទំនិញទេ<br>សូមសាកល្បងស្វែងរកម្តងទៀត</div>';
    return;
  }

  grid.innerHTML = '';
  items.forEach((it, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (idx*0.03)+'s';
    const thumbInner = it.photo_url
      ? `<img src="${it.photo_url}" loading="lazy">`
      : `<div class="ph">${it.category==='Account'?'👤':'🍈'}</div>`;
    const topBadge = it.category === 'Account'
      ? '<div class="badge-war">🛡️ Warranty 14ថ្ងៃ</div>'
      : '<div class="badge-trade">🔄 Trade</div>';
    const stockBadge = it.category === 'Account' ? '' : `<div class="badge-stock">${it.quantity} នៅសល់</div>`;
    card.innerHTML = `
      <div class="thumb">
        ${topBadge}
        ${stockBadge}
        ${thumbInner}
      </div>
      <div class="info">
        <div class="name">${it.name}</div>
        <div class="price">$${it.price}</div>
        <button class="buybtn">ទិញឥឡូវ</button>
      </div>`;
    card.onclick = ()=>openSheet(it);
    grid.appendChild(card);
  });
}

function openSheet(it){
  haptic();
  document.getElementById('sheetName').textContent = it.name;
  document.getElementById('sheetDesc').textContent = it.description || 'គ្មានពិពណ៌នាបន្ថែម';
  document.getElementById('sheetPrice').textContent = '$' + it.price;
  document.getElementById('sheetThumb').innerHTML = it.photo_url
    ? `<img src="${it.photo_url}">`
    : `<div class="ph">${it.category==='Account'?'👤':'🍈'}</div>`;
  const badges = document.getElementById('sheetBadges');
  if (it.category === 'Account') {
    badges.innerHTML = `<div class="b stock">📦 ${it.category}</div><div class="b war">🛡️ Warranty 14ថ្ងៃ</div>`;
  } else {
    badges.innerHTML = `<div class="b stock">📦 ${it.category}</div><div class="b stock">${it.quantity} នៅសល់</div><div class="b war" style="color:var(--gold-1);border-color:rgba(232,199,102,.4);background:rgba(232,199,102,.14)">🔄 Trade Item</div>`;
  }

  document.getElementById('sheetBuy').onclick = ()=>{
    haptic();
    const botUsername = document.body.dataset.bot;
    const url = `https://t.me/${botUsername}?start=buy_${it.id}`;
    if (tg?.openTelegramLink) { tg.openTelegramLink(url); }
    else { window.open(url, '_blank'); }
  };

  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
document.getElementById('sheetBg').onclick = ()=>{
  document.getElementById('sheetBg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
};

// music toggle
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
let musicOn = false;
musicBtn.onclick = ()=>{
  haptic();
  if (!music.querySelector('source')?.src){
    return alert('ម្ចាស់ហាងមិនទាន់កំណត់ចម្រៀងទេ');
  }
  musicOn = !musicOn;
  musicBtn.classList.toggle('active', musicOn);
  if (musicOn) music.play().catch(()=>{}); else music.pause();
};

// language toggle (KM default <-> EN labels for static chrome text)
const LANG_TEXT = {
  km: { search:'ស្វែងរក...', all:'ទាំងអស់', empty:'រកមិនឃើញទំនិញទេ', latest:'ថ្មីៗ' },
  en: { search:'Search...', all:'All', empty:'No items found', latest:'Newest' },
};
let curLang = 'km';
document.getElementById('langBtn').onclick = ()=>{
  haptic();
  curLang = curLang === 'km' ? 'en' : 'km';
  document.getElementById('searchInput').placeholder = LANG_TEXT[curLang].search;
  buildCatRow();
};

buildFX();
loadItems();
</script>
</body>
</html>
