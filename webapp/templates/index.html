<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uchiro Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --bg-card: rgba(18, 22, 36, 0.75);
    --bg-card-hover: rgba(26, 32, 53, 0.85);
    --border: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(79, 209, 255, 0.3);
    --gold-1: #fff3c4;
    --gold-2: #f3d069;
    --gold-3: #b88e28;
    --cyan: #4fd1ff;
    --cyan-glow: rgba(79, 209, 255, 0.4);
    --text-main: #f5f7fb;
    --text-muted: #8b93a7;
    --warranty: #35d68a;
    --danger: #ff5c6c;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', 'Noto Sans Khmer', sans-serif;
    overflow-x: hidden;
  }

  body { padding-bottom: 90px; }

  /* Ambient Canvas Lighting */
  .fx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .glow-top {
    position: absolute; width: 140vw; height: 140vw; left: 50%; top: -80vw;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(79, 209, 255, 0.12) 0%, rgba(243, 208, 105, 0.04) 40%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
  }

  .wrap { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* Header Utility Bar */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text-muted); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { color: var(--gold-2); border-color: var(--gold-2); background: rgba(243, 208, 105, 0.12); }
  .topbar-right { display: flex; gap: 8px; }

  /* Store Branding Header */
  header { padding: 8px 0 12px; text-align: center; }
  .logo-container { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; }
  .logo-ring {
    width: 100%; height: 100%; border-radius: 50%; padding: 3px;
    background: conic-gradient(from 0deg, var(--cyan), var(--gold-2), var(--cyan));
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-inner {
    width: 100%; height: 100%; border-radius: 50%; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .logo-inner img { width: 100%; height: 100%; object-fit: cover; }
  
  .logo-word {
    font-family: 'Anton', sans-serif; font-size: 32px; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 60%, var(--gold-3) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(243, 208, 105, 0.3));
  }
  .logo-sub { font-size: 11px; letter-spacing: 4px; color: var(--cyan); margin-top: 4px; font-weight: 700; }
  
  .badgerow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .trust-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
    border: 1px solid rgba(53, 214, 138, 0.3); background: rgba(53, 214, 138, 0.08);
    border-radius: 99px; font-size: 12px; color: var(--warranty); font-weight: 600;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warranty); box-shadow: 0 0 8px var(--warranty); }

  /* Controls Section (Search + Category + Price) */
  .searchbar { display: flex; gap: 8px; margin-top: 16px; }
  .search {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 12px 14px; backdrop-filter: blur(12px);
    transition: border-color 0.2s;
  }
  .search:focus-within { border-color: var(--cyan); box-shadow: 0 0 12px rgba(79, 209, 255, 0.15); }
  .search input {
    background: none; border: none; outline: none; color: var(--text-main);
    font-size: 14px; width: 100%; font-family: inherit;
  }
  .search input::placeholder { color: var(--text-muted); }

  .chiprow { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; scrollbar-width: none; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 9px 18px; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .chip.active {
    background: linear-gradient(135deg, rgba(79, 209, 255, 0.2), rgba(243, 208, 105, 0.15));
    border-color: var(--cyan); color: var(--text-main); box-shadow: 0 0 16px rgba(79, 209, 255, 0.2);
  }

  .pricerow { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  .pill {
    flex-shrink: 0; padding: 6px 14px; border-radius: 99px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); font-size: 12px; cursor: pointer; transition: all 0.2s;
  }
  .pill.active { border-color: var(--gold-2); color: var(--gold-1); background: rgba(243, 208, 105, 0.1); }

  /* Product Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; position: relative;
    backdrop-filter: blur(12px); display: flex; flex-direction: column;
    transition: transform 0.2s, border-color 0.2s; cursor: pointer;
  }
  .card:active { transform: scale(0.97); }
  
  .card .thumb {
    width: 100%; aspect-ratio: 1/1; background: rgba(0,0,0,0.2);
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .card:hover .thumb img { transform: scale(1.05); }

  .badge-tag {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 700;
    backdrop-filter: blur(8px);
  }
  .badge-tag.war { background: rgba(53, 214, 138, 0.2); border: 1px solid rgba(53, 214, 138, 0.5); color: var(--warranty); }
  .badge-tag.trade { background: rgba(243, 208, 105, 0.2); border: 1px solid rgba(243, 208, 105, 0.5); color: var(--gold-1); }

  .card .info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
  .card .name {
    font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 34px;
  }
  .card .bottom-row { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; }
  .card .price {
    font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.5px;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .add-btn {
    width: 32px; height: 32px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--cyan), #8be9ff); color: #05070d;
    display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer;
    box-shadow: 0 2px 8px var(--cyan-glow);
  }

  /* Cart Bar Floating Bottom */
  .cart-bar {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%);
    width: calc(100% - 32px); max-width: 488px; height: 60px;
    background: rgba(18, 22, 36, 0.9); border: 1px solid var(--border-glow);
    border-radius: 20px; backdrop-filter: blur(16px); z-index: 9;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .cart-bar.show { transform: translateX(-50%) translateY(0); }
  .cart-info { display: flex; align-items: center; gap: 12px; }
  .cart-count {
    background: var(--cyan); color: #05070d; font-weight: 800; font-size: 12px;
    width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .cart-total { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--gold-1); }
  .checkout-btn {
    background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); border: none;
    padding: 10px 20px; border-radius: 12px; color: #05070d; font-weight: 700; font-size: 13px;
    cursor: pointer; box-shadow: 0 4px 14px rgba(243, 208, 105, 0.3);
  }

  /* Details & Cart Sheets */
  .sheet-bg {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
    z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .sheet-bg.show { opacity: 1; pointer-events: all; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: #0b0e17; border-top: 1px solid var(--border);
    border-radius: 28px 28px 0 0; max-width: 520px; margin: 0 auto;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    max-height: 85vh; overflow-y: auto; padding-bottom: 24px;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 5px; background: var(--border); border-radius: 99px; margin: 12px auto 8px; }
  
  .sheet-body { padding: 12px 20px; }
  .sheet-thumb {
    width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden;
    background: rgba(255,255,255,0.03); margin-bottom: 16px; display: flex; align-items: center; justify-content: center;
  }
  .sheet-thumb img { width: 100%; height: 100%; object-fit: cover; }
  
  /* Skeleton Loader */
  .skel { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
  @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body data-bot="{{ bot_username }}">

  <div class="fx"><div class="glow-top"></div></div>

  <div class="wrap">
    <div class="topbar">
      <div class="icon-btn" id="musicBtn" title="Music">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="topbar-right">
        <div class="icon-btn" id="langBtn">🌐</div>
        <a class="icon-btn" href="https://t.me/{{ channel_username }}" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 2.7 2.6 10.3c-1.3.5-1.3 1.2-.2 1.6l4.9 1.5 1.9 5.8c.2.6.4.8.9.8s.7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.8-.8L23.9 4c.4-1.3-.4-1.9-1.9-1.3Z"/></svg>
        </a>
      </div>
    </div>
    
    <audio id="bgMusic" loop preload="none">
      {% if music_url %}<source src="{{ music_url }}">{% endif %}
    </audio>

    <header>
      <div class="logo-container">
        <div class="logo-ring">
          <div class="logo-inner">
            {% if logo_url %}<img src="{{ logo_url }}">{% else %}<span style="font-size:30px;">🏴‍☠️</span>{% endif %}
          </div>
        </div>
      </div>
      <div class="logo-word">UCHIRO STORE</div>
      <div class="logo-sub">BLOX FRUITS · MULTI-GAME</div>
      <div class="badgerow">
        <div class="trust-badge"><span class="live-dot"></span> ការទិញត្រូវបានធានា 100%</div>
      </div>
    </header>

    <div class="searchbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b93a7" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="ស្វែងរកទំនិញ..." />
      </div>
    </div>

    <div class="chiprow" id="catRow"></div>
    
    <div class="pricerow" id="priceRow">
      <div class="pill active" data-min="0" data-max="999999">ទាំងអស់</div>
      <div class="pill" data-min="0" data-max="10">ក្រោម $10</div>
      <div class="pill" data-min="10" data-max="25">$10 - $25</div>
      <div class="pill" data-min="25" data-max="999999">$25+</div>
    </div>

    <div class="grid" id="grid">
      <!-- Skeleton Loaders -->
      <div class="card" style="height: 220px;"><div class="thumb skel"></div></div>
      <div class="card" style="height: 220px;"><div class="thumb skel"></div></div>
    </div>
  </div>

  <!-- Bottom Floating Cart -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-info">
      <div class="cart-count" id="cartCount">0</div>
      <div>
        <div style="font-size: 11px; color: var(--text-muted);">សរុប</div>
        <div class="cart-total" id="cartTotal">$0.00</div>
      </div>
    </div>
    <button class="checkout-btn" onclick="checkout()">ទិញទំនិញ ➔</button>
  </div>

  <!-- Details Sheet -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body">
      <div class="sheet-thumb" id="sheetThumb"></div>
      <h2 id="sheetName" style="margin: 0 0 6px 0; font-size: 20px;"></h2>
      <div id="sheetBadges" style="display:flex; gap:6px; margin-bottom: 12px;"></div>
      <p id="sheetDesc" style="color: var(--text-muted); font-size: 13px; line-height: 1.6; margin: 0 0 20px 0;"></p>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div class="card .price" id="sheetPrice" style="font-size:28px; font-family:'Anton'; color:var(--gold-1);"></div>
        <button class="checkout-btn" id="sheetAddBtn" style="padding: 12px 28px; font-size: 14px;">បន្ថែមទៅកន្ត្រក</button>
      </div>
    </div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#05070d'); tg.setBackgroundColor?.('#05070d'); }

let ALL_ITEMS = [];
let CATEGORIES = [];
let CART = {};
let state = { category: 'All', search: '', min: 0, max: 999999 };

function haptic(style = 'light'){ tg?.HapticFeedback?.impactOccurred(style); }

async function loadItems(){
  try {
    const res = await fetch('/api/items');
    const data = await res.json();
    ALL_ITEMS = data.items || [];
    CATEGORIES = ['All', ...(data.categories || [])];
    buildCatRow();
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">ពុំមានទិន្នន័យ</div>';
  }
}

function buildCatRow(){
  const row = document.getElementById('catRow');
  row.innerHTML = CATEGORIES.map(cat => `
    <div class="chip ${cat === state.category ? 'active' : ''}" onclick="setCategory('${cat}')">
      ${cat === 'All' ? 'ទាំងអស់' : cat}
    </div>
  `).join('');
}

function setCategory(cat){
  haptic(); state.category = cat; buildCatRow(); render();
}

document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value.trim().toLowerCase(); render();
});

document.querySelectorAll('#priceRow .pill').forEach(p => {
  p.onclick = () => {
    haptic();
    document.querySelectorAll('#priceRow .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    state.min = parseFloat(p.dataset.min);
    state.max = parseFloat(p.dataset.max);
    render();
  };
});

function addToCart(id, e){
  if(e) e.stopPropagation();
  haptic('medium');
  CART[id] = (CART[id] || 0) + 1;
  updateCartUI();
}

function updateCartUI(){
  const count = Object.values(CART).reduce((a, b) => a + b, 0);
  const total = Object.entries(CART).reduce((sum, [id, qty]) => {
    const item = ALL_ITEMS.find(i => i.id == id);
    return sum + (item ? item.price * qty : 0);
  }, 0);

  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
  document.getElementById('cartBar').classList.toggle('show', count > 0);
}

function render(){
  const grid = document.getElementById('grid');
  let items = ALL_ITEMS.filter(it => {
    if (state.category !== 'All' && it.category !== state.category) return false;
    if (state.search && !it.name.toLowerCase().includes(state.search)) return false;
    if (it.price < state.min || it.price > state.max) return false;
    return true;
  });

  if (items.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">រកមិនឃើញទំនិញទេ</div>';
    return;
  }

  grid.innerHTML = items.map(it => `
    <div class="card" onclick="openSheet(${it.id})">
      <div class="thumb">
        <span class="badge-tag ${it.category === 'Account' ? 'war' : 'trade'}">
          ${it.category === 'Account' ? '🛡️ Warranty' : '🔄 Trade'}
        </span>
        ${it.photo_url ? `<img src="${it.photo_url}" loading="lazy">` : `<span style="font-size:36px;">🍈</span>`}
      </div>
      <div class="info">
        <div class="name">${it.name}</div>
        <div class="bottom-row">
          <div class="price">$${it.price}</div>
          <button class="add-btn" onclick="addToCart(${it.id}, event)">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

let activeSheetItem = null;
function openSheet(id){
  haptic();
  const it = ALL_ITEMS.find(x => x.id === id);
  if(!it) return;
  activeSheetItem = it;

  document.getElementById('sheetName').textContent = it.name;
  document.getElementById('sheetDesc').textContent = it.description || 'គ្មានការពិពណ៌នា';
  document.getElementById('sheetPrice').textContent = '$' + it.price;
  document.getElementById('sheetThumb').innerHTML = it.photo_url 
    ? `<img src="${it.photo_url}">` 
    : `<span style="font-size:48px;">🍈</span>`;

  document.getElementById('sheetAddBtn').onclick = () => {
    addToCart(it.id);
    closeSheet();
  };

  document.getElementById('sheetBg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetBg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
document.getElementById('sheetBg').onclick = closeSheet;

function checkout(){
  haptic('heavy');
  const botUsername = document.body.dataset.bot;
  // Constructs payload like: buy_1x2_4x1 (item 1 qty 2, item 4 qty 1)
  const payload = Object.entries(CART).map(([id, qty]) => `${id}x${qty}`).join('_');
  const url = `https://t.me/${botUsername}?start=cart_${payload}`;
  
  if (tg?.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url, '_blank');
}

// Audio Toggle
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
let musicOn = false;
musicBtn.onclick = () => {
  haptic();
  if (!music.querySelector('source')?.src) return alert('គ្មានបទចម្រៀង');
  musicOn = !musicOn;
  musicBtn.classList.toggle('active', musicOn);
  musicOn ? music.play().catch(()=>{}) : music.pause();
};

loadItems();
</script>
</body>
</html>
